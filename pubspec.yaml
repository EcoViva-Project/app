name: eco_app
description: "EcoViva - App Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  go_router: ^16.2.1
  http: ^1.6.0
  intl: any
  latlong2: ^0.10.1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/map/tiles/
  # As fontes entram só pela seção abaixo (quatro pesos). Listar a pasta em
  # `assets` empacotava também as 12 variações que o app não usa.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/static/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/static/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/static/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/static/PlusJakartaSans-Bold.ttf
          weight: 700
